<!doctype html><meta charset="utf-8"><body><pre id="o" style="font:12px monospace"></pre>
<button id="plainbtn" command="show-modal" commandfor="d1">plain</button>
<pl-dialog id="d1"><h2 data-title>D1</h2></pl-dialog>
<pl-button id="plbtn" command="show-modal" commandfor="d2">pl</pl-button>
<pl-dialog id="d2"><h2 data-title>D2</h2></pl-dialog>
<pl-button id="popbtn" popovertarget="p1">pop</pl-button>
<pl-popover id="p1"><p>x</p></pl-popover>
<script type="module">
await import('/Library/index.mjs');
const o=[];const w=ms=>new Promise(r=>setTimeout(r,ms));
await w(200);
const d1=document.getElementById('d1'), d2=document.getElementById('d2'), p1=document.getElementById('p1');
document.getElementById('plainbtn').click(); await w(60);
o.push('plain <button> command  -> dialog open = '+d1.open);
d1.open&&d1.close();
document.getElementById('plbtn').click(); await w(60);
o.push('pl-button command       -> dialog open = '+d2.open);
document.getElementById('popbtn').click(); await w(60);
o.push('pl-button popovertarget -> popover open = '+p1.matches(':popover-open'));
const inner=document.getElementById('plbtn').native;
o.push('--- diagnosis ---');
o.push('inner <button> has command attr = '+inner.hasAttribute('command')+', commandfor = '+inner.hasAttribute('commandfor'));
o.push('IDL props exist: commandForElement='+('commandForElement' in inner)+' popoverTargetElement='+('popoverTargetElement' in inner));
// can an element-valued reference cross the shadow boundary?
inner.commandForElement = d2.dialog; inner.command='show-modal';
document.getElementById('plbtn').click(); await w(60);
o.push('after setting commandForElement across shadow -> dialog open = '+d2.open);
document.getElementById('o').textContent=o.join('\n');
</script></body>
